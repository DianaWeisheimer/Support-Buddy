name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        run: pytest tests/ -v
        env:
          OPENAI_API_KEY: "test-key-not-used"
          # Diz ao Python onde procurar os módulos do projeto.
          # "." significa a raiz do repositório — onde ficam as pastas
          # services/ e api/. Sem isso, "from services.X import Y" falha.
          PYTHONPATH: "."